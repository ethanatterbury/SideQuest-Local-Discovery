name: Check Commons venue image metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/geograph-source-check.yml]

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect one known source record without downloading an image
        run: |
          node --input-type=module <<'NODE'
          const url = new URL("https://commons.wikimedia.org/w/api.php");
          url.search = new URLSearchParams({
            action: "query", format: "json", formatversion: "2", maxlag: "5",
            titles: [
              "File:The Harbour Screen - geograph.org.uk - 6225569.jpg",
              "File:Wigfield Farm, Barnsley - geograph.org.uk - 7925475.jpg",
              "File:Altrincham Grammar School for Boys - geograph.org.uk - 5330008.jpg",
              "File:Boatyard Boulders - geograph.org.uk - 8341843.jpg",
            ].join("|"), redirects: "1", prop: "imageinfo",
            iiprop: "url|size|mime|extmetadata", iiurlwidth: "960",
            iiextmetadatalanguage: "en",
          });
          const response = await fetch(url, {
            signal: AbortSignal.timeout(15000), redirect: "error",
            headers: { "User-Agent": "SideQuest/1.0 (https://sidequest-local-discovery.vercel.app; contact https://github.com/ethanatterbury/SideQuest-Local-Discovery/issues)", Accept: "application/json" },
          });
          console.log(JSON.stringify({ status: response.status }));
          if (!response.ok) process.exit(0);
          const reader = response.body.getReader();
          const chunks = [];
          let size = 0;
          while (true) {
            const {done,value} = await reader.read();
            if (done) break;
            size += value.byteLength;
            if (size > 524288) { await reader.cancel(); throw new Error("Metadata size limit"); }
            chunks.push(value);
          }
          const data = JSON.parse(Buffer.concat(chunks).toString("utf8"));
          if (data.error) console.log(JSON.stringify({ error: data.error.code }));
          for (const page of data.query?.pages || []) {
            const info = page.imageinfo?.[0] || {};
            console.log(JSON.stringify({ title: page.title, mime: info.mime,
              originalUrl: info.url, thumbnailUrl: info.thumburl,
              descriptionUrl: info.descriptionurl,
              license: info.extmetadata?.LicenseShortName?.value,
              width: info.width, height: info.height,
            }));
          }
          NODE
