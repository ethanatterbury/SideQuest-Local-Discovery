name: Prepare England catalogue

# Manual maintenance only. Live discovery must not trigger catalogue redeployments.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: england-catalogue-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: base
        name: Record the catalogue revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: pip install osmium==4.3.2
      - run: python -m unittest discover -s tests -p test_import_osm_extract.py
      - name: Import and audit free OSM metadata under fixed quotas
        run: npm run prepare:england
      - name: Retain coverage and normalization audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: england-catalogue-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/england/coverage.json
            work/england/catalog-audit.json
          retention-days: 14
      - name: Retain the compressed metadata publication candidate
        uses: actions/upload-artifact@v4
        with:
          name: england-catalogue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/providers/data/regions/england.json.gz
          if-no-files-found: error
          retention-days: 14
      - name: Explain catalogue coverage and limits
        if: always()
        run: |
          {
            echo "### England venue metadata"
            echo "Catalogue revision: ${{ steps.base.outputs.sha }}"
            echo "Free Geofabrik/OpenStreetMap metadata only: no image downloads and no paid API."
            echo "The importer has a 2048 MiB PBF download cap; publication has a 50 MiB compressed metadata cap."
            echo "Publication requires the England source, at least 10,000 named records and normalized venues, and at least 10 venues near each of eight national coverage sample areas."
            echo "This is a geographic release check; it does not establish every venue's completeness, current opening status or photo coverage."
            if [ -f work/england/catalog-audit.json ]; then
              echo '```json'
              cat work/england/catalog-audit.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: england-catalogue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/england-publication
      - name: Publish only the audited compressed metadata
        env:
          VERIFIED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$VERIFIED_BASE_SHA"
            if ! git diff --quiet "$VERIFIED_BASE_SHA" HEAD -- \
              .github/workflows/england-catalogue.yml package.json package-lock.json \
              scripts/import-osm-extract.py scripts/prepare-england.mjs \
              scripts/audit-catalog.mjs scripts/lib/england-coverage.mjs \
              src/providers/nearby-places.ts src/domain \
              src/providers/data/regions/england.json.gz; then
              echo "The national source or its import and normalization checks changed. The candidate is retained; rerun preparation against current main." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "The audited importer, normalization checks and national source are unchanged; independent UI and photo work can advance." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p src/providers/data/regions
          cp work/england-publication/england.json.gz src/providers/data/regions/england.json.gz
          git add -- src/providers/data/regions/england.json.gz
          if git diff --cached --quiet; then
            echo "No England venue metadata changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh audited England venue metadata"
          # A normal fast-forward push also rejects a race after the revision check.
          git push origin HEAD:main
          echo "Published audited England metadata: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
